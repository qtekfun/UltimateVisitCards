# Memoria contenida: un solo daemon de Gradle con heap moderado y el compilador de Kotlin dentro de él
# (sin daemon de Kotlin aparte). Los tests corren en un único fork con heap limitado (ver build.gradle.kts).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Versión de la app (SemVer, opcionalmente -rc.N); el versionCode se deriva de ella (ver app/build.gradle.kts).
appVersion=0.12.0
