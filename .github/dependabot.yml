# Actualizaciones semanales de dependencias (Gradle y GitHub Actions), agrupadas en un PR por ecosistema.
# Cada PR pasa por el CI como cualquier cambio; ninguna dependencia nueva entra por aquí (solo versiones).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
