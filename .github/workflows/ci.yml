# Verificación de cada PR y de main: el mismo ./gradlew ci que en local, más un build de release
# (sin firmar) de ambos flavours para detectar a tiempo problemas de R8/minificación.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # También valida el checksum del Gradle wrapper.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Compilación, tests, lint, ktlint y comprobación de permisos (play y foss)
        run: ./gradlew --continue ci

      - name: Build de release sin firmar (R8) de ambos flavours
        run: ./gradlew assemblePlayRelease assembleFossRelease bundlePlayRelease

      - name: Subir informes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          retention-days: 14
